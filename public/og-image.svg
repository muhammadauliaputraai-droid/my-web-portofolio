<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#140b18"/>
    </linearGradient>

    <!-- Sky Blue to Rose Gradient -->
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>

    <!-- Ambient Glows -->
    <radialGradient id="glowSky" cx="0.1" cy="0.1" r="0.6">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowRose" cx="0.9" cy="0.9" r="0.6">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>

    <!-- Dot Grid Pattern -->
    <pattern id="dotGrid" x="0" y="0" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#38bdf8" fill-opacity="0.12"/>
    </pattern>

    <!-- Card Filter / Shadow -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="35" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Ambient Light Orbs -->
  <rect width="1200" height="630" fill="url(#glowSky)"/>
  <rect width="1200" height="630" fill="url(#glowRose)"/>

  <!-- Dot Grid Overlay -->
  <rect width="1200" height="630" fill="url(#dotGrid)"/>

  <!-- Subtle Top & Bottom Accent Lines -->
  <line x1="0" y1="2" x2="1200" y2="2" stroke="url(#accentGrad)" stroke-width="4" opacity="0.8"/>
  <line x1="0" y1="628" x2="1200" y2="628" stroke="url(#accentGrad)" stroke-width="4" opacity="0.8"/>

  <!-- Center Card -->
  <g filter="url(#cardShadow)">
    <rect x="100" y="75" width="1000" height="480" rx="32" fill="#0f172a" fill-opacity="0.75" stroke="#334155" stroke-width="1.5"/>
    <!-- Top inner glow border -->
    <rect x="101" y="76" width="998" height="478" rx="31" fill="none" stroke="url(#accentGrad)" stroke-width="1" stroke-opacity="0.4"/>
  </g>

  <!-- Status Pill Badge -->
  <g transform="translate(475, 120)">
    <rect width="250" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="22" cy="18" r="5" fill="#10b981"/>
    <text x="36" y="23" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Available for Opportunities</text>
  </g>

  <!-- Monogram Logo Icon -->
  <g transform="translate(550, 180)">
    <rect width="100" height="100" rx="24" fill="url(#accentGrad)"/>
    <rect x="3" y="3" width="94" height="94" rx="21" fill="#0f172a"/>
    <text x="50" y="62" text-anchor="middle" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" letter-spacing="1">AP</text>
  </g>

  <!-- Developer Name -->
  <text x="600" y="335" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" letter-spacing="-1">
    Muhammad Aulia Putra
  </text>

  <!-- Role / Subtitle -->
  <text x="600" y="375" text-anchor="middle" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" letter-spacing="0.5">
    Software Engineer • Full-Stack Web Developer
  </text>

  <!-- Description Line -->
  <text x="600" y="415" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
    Building modern, high-performance web applications with React 19, TypeScript &amp; Supabase
  </text>

  <!-- Tech Stack Chips -->
  <g transform="translate(260, 455)">
    <!-- Chip 1 -->
    <g transform="translate(0, 0)">
      <rect width="120" height="34" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="60" y="22" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">React 19</text>
    </g>
    <!-- Chip 2 -->
    <g transform="translate(135, 0)">
      <rect width="130" height="34" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="65" y="22" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">TypeScript</text>
    </g>
    <!-- Chip 3 -->
    <g transform="translate(280, 0)">
      <rect width="125" height="34" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="62" y="22" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">Supabase</text>
    </g>
    <!-- Chip 4 -->
    <g transform="translate(420, 0)">
      <rect width="120" height="34" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="60" y="22" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">Next.js</text>
    </g>
    <!-- Chip 5 -->
    <g transform="translate(555, 0)">
      <rect width="125" height="34" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="62" y="22" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">Tailwind CSS</text>
    </g>
  </g>

  <!-- Bottom Website Badge -->
  <g transform="translate(515, 508)">
    <text x="85" y="16" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="1">AULIA.DEV</text>
  </g>
</svg>
